# Evita que el proyecto gratuito de Supabase se pause por inactividad (7 días sin uso).
# Corre dos veces por semana y hace una consulta ligera (función ping()) con la anon key.
name: Anti-pausa de Supabase

on:
  schedule:
    - cron: '17 14 * * 1,4' # lunes y jueves, 14:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y SUPABASE_ANON_KEY."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'
          echo
          echo "Supabase respondió correctamente."
